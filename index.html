
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OPEN WORLD INDIA | Premium City Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb;color:white}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.panel{background:#071321dc;border:1px solid #ffffff38;border-radius:12px;box-shadow:0 5px 20px #0005}
#brand{position:absolute;top:12px;left:12px;padding:10px 14px}
#brand b{display:block;font-size:16px;letter-spacing:1.5px;color:#ffd34e}
#brand small{font-size:10px;color:#dce8f3;letter-spacing:2px}
#stats{position:absolute;top:12px;right:12px;padding:9px 12px;font-size:12px;line-height:1.7;min-width:130px}
#mapWrap{position:absolute;right:12px;top:112px;width:145px;height:145px;border:2px solid #ffffffaa;border-radius:12px;overflow:hidden;background:#071321dd}
#map{width:100%;height:100%}
#mission{position:absolute;left:12px;top:98px;padding:10px 12px;font-size:12px;line-height:1.6}
#mission b{color:#ffd34e}
#message{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:12px 18px;font-size:14px;text-align:center;display:none;max-width:85%;min-width:220px}
#prompt{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);padding:9px 14px;font-size:13px;display:none;white-space:nowrap}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 12px;font-size:11px;text-align:center;white-space:nowrap}
#controls{position:fixed;inset:0;z-index:8;pointer-events:none}
#joyBase{position:absolute;left:20px;bottom:22px;width:126px;height:126px;border-radius:50%;background:#06132166;border:2px solid #ffffff80;pointer-events:auto;touch-action:none}
#joyStick{position:absolute;left:37px;top:37px;width:48px;height:48px;border-radius:50%;background:#ffffffc9;border:2px solid #fff}
.ctrlBtn{position:absolute;right:20px;border:1px solid #ffffffbb;border-radius:50%;width:62px;height:62px;background:#10243de8;color:white;font-weight:bold;font-size:11px;pointer-events:auto;touch-action:none}
#jumpBtn{bottom:24px}
#runBtn{bottom:96px;width:54px;height:54px;right:90px}
#talkBtn{bottom:168px;display:none}
#driveBtn{bottom:168px;display:none;background:#145b43ed}
@media(hover:hover) and (pointer:fine){#controls{display:none}}
@media(max-width:600px){
#brand{top:7px;left:7px;padding:7px 9px}
#brand b{font-size:12px}
#brand small{font-size:8px}
#stats{top:7px;right:7px;padding:6px 8px;font-size:10px;min-width:105px}
#mapWrap{top:88px;right:7px;width:108px;height:108px}
#mission{top:76px;left:7px;font-size:10px;padding:7px 9px}
#help{font-size:9px;bottom:4px}
}
</style>
</head>
<body>

<div id="hud">
 <div id="brand" class="panel">
  <b>OPEN WORLD INDIA</b>
  <small>CITY EXPLORER • PREMIUM BUILD</small>
 </div>

 <div id="stats" class="panel">
  🪙 Coins: <span id="coinCount">0</span>/5<br>
  🚶 Mode: <span id="mode">WALK</span><br>
  🌤️ <span id="weatherTime">DAY</span>
 </div>

 <div id="mapWrap">
  <canvas id="map" width="180" height="180"></canvas>
 </div>

 <div id="mission" class="panel">
  <b>MISSION 01</b><br>
  Collect all 5 golden coins<br>
  <span id="missionStatus">Explore the city!</span>
 </div>

 <div id="message" class="panel"></div>
 <div id="prompt" class="panel"></div>
</div>

<div id="controls">
 <div id="joyBase"><div id="joyStick"></div></div>
 <button class="ctrlBtn" id="jumpBtn">JUMP</button>
 <button class="ctrlBtn" id="runBtn">RUN</button>
 <button class="ctrlBtn" id="talkBtn">TALK</button>
 <button class="ctrlBtn" id="driveBtn">DRIVE</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
const daySky=new THREE.Color(0x8bc9ee);
const nightSky=new THREE.Color(0x101b38);

scene.background=daySky.clone();
scene.fog=new THREE.Fog(0x8bc9ee,95,310);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x526044,2.0);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffffff,1.25);
sun.position.set(-45,85,35);
scene.add(sun);

const mat=c=>new THREE.MeshLambertMaterial({color:c});

const mats={
 road:mat(0x303640),
 line:mat(0xf4e7b0),
 side:mat(0xaaaeb0),
 grass:mat(0x477b43),
 white:mat(0xe8e8df),
 glass:mat(0x4c8497),
 darkglass:mat(0x243f56),
 trunk:mat(0x69452d),
 leaf:mat(0x347d46),
 lamp:mat(0x252c35)
};

function box(parent,w,h,d,material,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}

function cylinder(parent,r1,r2,h,material,x,y,z,segments=8){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}

function group(parent=scene){
 const g=new THREE.Group();
 parent.add(g);
 return g;
}

// CITY GROUND
box(scene,420,.2,420,mats.grass,0,-.16,0);

// ROAD SYSTEM
function road(x,z,w,d){
 box(scene,w,.12,d,mats.road,x,0,z);

 if(w>d){
  for(let a=-w/2+5;a<w/2-2;a+=8){
   box(scene,2,.015,.16,mats.line,x+a,.07,z);
  }
 }else{
  for(let a=-d/2+5;a<d/2-2;a+=8){
   box(scene,.16,.015,2,mats.line,x,.07,z+a);
  }
 }

 if(w>d){
  box(scene,w,.2,2.1,mats.side,x,.02,z-d/2-1.5);
  box(scene,w,.2,2.1,mats.side,x,.02,z+d/2+1.5);
 }else{
  box(scene,2.1,.2,d,mats.side,x-w/2-1.5,.02,z);
  box(scene,2.1,.2,d,mats.side,x+w/2+1.5,.02,z);
 }
}

road(0,0,400,15);
road(0,0,15,400);
road(0,72,400,13);
road(72,0,13,400);
road(-72,0,13,400);
road(0,-72,400,13);

// BUILDING SYSTEM
function building(x,z,w,d,h,color,kind=0){
 const g=group();

 box(g,w,h,d,mat(color),x,h/2,z);
 box(g,w+.4,.5,d+.4,mat(kind===1?0x303945:0xddd8ce),x,h+.15,z);

 const cols=Math.max(2,Math.floor(w/3));
 const rows=Math.max(2,Math.floor(h/3.2));

 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const wx=x-w/2+1.2+c*(w-2.4)/Math.max(1,cols-1);
   const wy=1.5+r*(h-2.5)/Math.max(1,rows-1);

   box(g,.85,1.05,.08,kind===1?mats.darkglass:mats.glass,wx,wy,z-d/2-.05);

   if(kind===0){
    box(g,.9,.09,.1,mats.white,wx,wy-.58,z-d/2-.02);
   }
  }
 }

 for(let r=0;r<Math.min(rows,5);r++){
  for(let c=0;c<2;c++){
   box(g,.08,.9,.85,mats.glass,x+w/2+.05,1.8+r*3,z-d/2+1.5+c*(d-3));
  }
 }

 if(kind===2){
  box(g,w*.7,1.5,.15,mat(0x263747),x,1,z-d/2-.1);
  box(g,w*.45,.25,.18,mat(0xffc84a),x,2,z-d/2-.2);
 }

 return g;
}

const blocks=[
 [-30,-31,19,20,22,0xd7c4a6,0],
 [-30,31,20,20,31,0xb9c7d0,0],
 [31,-31,20,20,38,0x6d8e9e,1],
 [31,31,20,20,25,0xd9bca0,0],
 [-108,-28,24,28,44,0x607e92,1],
 [-108,31,23,25,29,0xd1c2ae,0],
 [108,-30,25,24,48,0x6c8796,1],
 [108,31,24,24,35,0xd0d0c7,0],
 [-30,-108,25,24,30,0xc4b69f,0],
 [30,-108,22,25,52,0x55798d,1],
 [-30,108,23,24,36,0x9cabb3,0],
 [31,108,25,24,43,0x6e899b,1],
 [-145,-110,25,25,34,0xc4b49b,0],
 [145,-110,25,25,40,0x688393,1],
 [-145,110,25,25,29,0xd1c2b0,0],
 [145,110,25,25,46,0x617e91,1]
];

for(const b of blocks)building(...b);

building(-53,-22,12,12,8,0xd6a45e,2);
building(53,22,12,12,8,0xd6a45e,2);
building(-53,53,13,11,9,0x72a9a0,2);
building(53,-53,13,11,9,0xd0a16b,2);

// TREES
function tree(x,z,s=1){
 const g=group();

 cylinder(g,.22*s,.32*s,2.2*s,mats.trunk,x,1.1*s,z);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(1.15*s,7,6),mats.leaf
 );

 crown.position.set(x,2.5*s,z);
 g.add(crown);
}

for(let x=-175;x<=175;x+=14){
 if(Math.abs(x)>12){
  tree(x,11);tree(x,-11);tree(x,83);tree(x,-83);
 }
}

for(let z=-175;z<=175;z+=14){
 if(Math.abs(z)>12){
  tree(11,z);tree(-11,z);tree(83,z);tree(-83,z);
 }
}

// STREETLIGHTS
function streetLight(x,z){
 const g=group();

 cylinder(g,.12,.16,5,mats.lamp,x,2.5,z);
 box(g,1.5,.13,.16,mats.lamp,x+.65,5,z);

 const bulb=new THREE.Mesh(
  new THREE.SphereGeometry(.25,7,6),
  mat(0xffe7a2)
 );

 bulb.position.set(x+1.25,4.85,z);
 g.add(bulb);
}

for(let p=-160;p<=160;p+=32){
 streetLight(p,10);
 streetLight(p,-10);
 streetLight(10,p);
 streetLight(-10,p);
}

// TRAFFIC LIGHTS
function traffic(x,z){
 const g=group();

 cylinder(g,.12,.16,4,mats.lamp,x,2,z);
 box(g,.7,1.8,.55,mat(0x20252b),x,4.4,z);

 [0xff3434,0xffd13d,0x48d66b].forEach((c,i)=>{
  const l=new THREE.Mesh(
   new THREE.SphereGeometry(.17,8,6),mat(c)
  );
  l.position.set(x,5.05-i*.62,z+.29);
  g.add(l);
 });
}

traffic(9,9);
traffic(-9,-9);
traffic(9,-9);
traffic(-9,9);

// PARK
box(scene,35,.12,28,mat(0x55934e),-118,.02,0);

for(let x=-130;x<-105;x+=6){
 for(let z=-10;z<12;z+=7){
  tree(x,z,.8);
 }
}

box(scene,12,.16,2,mat(0xb9a27d),-118,.12,0);

// PETROL PUMP
building(125,-8,22,15,7,0xe1e4dc,2);
box(scene,20,.3,15,mat(0xd9dce0),125,7.3,-8);

for(let x=120;x<=130;x+=10){
 box(scene,1,2,1,mat(0xe9e9e9),x,1,-3);
 box(scene,.7,.6,.7,mat(0xd12e32),x,2.2,-3);
}

// PLAYER CHARACTER
const player=group();

const skin=mat(0xc98f68);
const shirt=mat(0x2366b2);
const pants=mat(0x26364c);
const hair=mat(0x24201c);
const shoe=mat(0x17191c);

box(player,1,1.25,.55,shirt,0,1.65,0);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.38,10,8),skin
);
head.position.y=2.55;
player.add(head);

const hairMesh=new THREE.Mesh(
 new THREE.SphereGeometry(.39,10,6,0,Math.PI*2,0,Math.PI/2),hair
);
hairMesh.position.y=2.72;
player.add(hairMesh);

for(const side of [-1,1]){
 box(player,.25,.9,.28,skin,side*.66,1.68,0);
 box(player,.34,.9,.38,pants,side*.25,.55,0);
 box(player,.38,.18,.55,shoe,side*.25,.12,.05);
}

player.position.set(0,0,24);
scene.add(player);

// CARS AND BIKES
function makeVehicle(x,z,color,bike=false){
 const g=group();

 box(g,bike?.65:2,bike?.55:0.8,bike?2.2:3.5,mat(color),0,bike?.9:.85,0);

 if(!bike){
  box(g,1.5,.65,1.7,mat(0x9bc4d4),0,1.45,-.1);

  for(const xx of [-.8,.8]){
   for(const zz of [-1.1,1.1]){
    const wh=new THREE.Mesh(
     new THREE.CylinderGeometry(.38,.38,.22,10),mat(0x17191c)
    );
    wh.rotation.z=Math.PI/2;
    wh.position.set(xx,.42,zz);
    g.add(wh);
   }
  }
 }else{
  for(const zz of [-.8,.8]){
   const wh=new THREE.Mesh(
    new THREE.TorusGeometry(.42,.12,6,12),mat(0x17191c)
   );
   wh.rotation.y=Math.PI/2;
   wh.position.set(0,.45,zz);
   g.add(wh);
  }

  box(g,.18,.7,.2,mat(0x333333),0,1.2,0);
 }

 g.position.set(x,0,z);
 scene.add(g);

 return {group:g,bike,speed:0};
}

const vehicles=[
 makeVehicle(-17,25,0xd33b34),
 makeVehicle(18,-24,0x276bb1),
 makeVehicle(92,12,0xe5b52d),
 makeVehicle(-35,-18,0x333333,true),
 makeVehicle(42,45,0x27a36b,true)
];

// NPC CHARACTERS
const npcs=[];

function makeNPC(x,z,name,color){
 const g=group();

 box(g,.75,1.05,.45,mat(color),0,1.25,0);

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.3,8,7),skin
 );
 h.position.y=2;
 g.add(h);

 box(g,.35,.15,.35,hair,0,2.2,0);

 for(const s of [-1,1]){
  box(g,.22,.75,.24,skin,s*.48,1.3,0);
  box(g,.25,.75,.28,pants,s*.2,.45,0);
 }

 g.position.set(x,0,z);
 scene.add(g);

 npcs.push({
  group:g,
  name,
  baseX:x,
  baseZ:z,
  phase:Math.random()*6
 });
}

[
 ['Ravi',-23,18,0x2e8b57],
 ['Asha',24,18,0x9b4f9b],
 ['Shopkeeper',-47,-17,0xd38b37],
 ['Guide',48,-22,0x287b9d],
 ['Student',-118,18,0x8d5541],
 ['Driver',105,22,0x567a40],
 ['Tourist',35,58,0xc05b45],
 ['Friend',-40,-58,0x5963a5]
].forEach(a=>makeNPC(a[1],a[2],a[0],a[3]));

// GOLD COINS
const coinMat=new THREE.MeshStandardMaterial({
 color:0xffca28,
 metalness:.65,
 roughness:.25
});

const coinPositions=[
 [-28,0,28],
 [28,0,28],
 [-28,0,-28],
 [28,0,-28],
 [118,0,0]
];

const coinObjects=[];

for(const [x,y,z] of coinPositions){
 const c=new THREE.Mesh(
  new THREE.TorusGeometry(.7,.2,8,16),coinMat
 );
 c.position.set(x,1.8,z);
 scene.add(c);
 coinObjects.push(c);
}

// GAME VARIABLES
let activeVehicle=null;
let coins=0;
let night=false;
let jumpV=0;
let onGround=true;
let runHeld=false;

const keys={};
let joy={x:0,y:0};

// KEYBOARD CONTROLS
addEventListener('keydown',e=>{
 keys[e.code]=true;

 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){
  e.preventDefault();
 }

 if(e.code==='KeyE')toggleVehicle();
 if(e.code==='KeyF')talk();
 if(e.code==='KeyN')toggleNight();
 if(e.code==='Space')jump();
});

addEventListener('keyup',e=>keys[e.code]=false);

// MOBILE JOYSTICK
const joyBase=document.getElementById('joyBase');
const joyStick=document.getElementById('joyStick');

let joyId=null;

joyBase.addEventListener('pointerdown',e=>{
 joyId=e.pointerId;
 joyBase.setPointerCapture(joyId);
 moveJoy(e);
});

joyBase.addEventListener('pointermove',e=>{
 if(e.pointerId===joyId)moveJoy(e);
});

function moveJoy(e){
 const r=joyBase.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;

 const len=Math.hypot(dx,dy);
 const max=42;

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 joy={x:dx/max,y:dy/max};
 joyStick.style.transform=`translate(${dx}px,${dy}px)`;
}

function endJoy(e){
 if(e.pointerId===joyId){
  joyId=null;
  joy={x:0,y:0};
  joyStick.style.transform='translate(0,0)';
 }
}

joyBase.addEventListener('pointerup',endJoy);
joyBase.addEventListener('pointercancel',endJoy);

document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{
 e.preventDefault();
 jump();
});

const runBtn=document.getElementById('runBtn');

runBtn.addEventListener('pointerdown',()=>runHeld=true);

['pointerup','pointercancel','pointerleave'].forEach(ev=>{
 runBtn.addEventListener(ev,()=>runHeld=false);
});

document.getElementById('talkBtn').addEventListener('click',talk);
document.getElementById('driveBtn').addEventListener('click',toggleVehicle);

// JUMP
function jump(){
 if(onGround&&!activeVehicle){
  jumpV=7;
  onGround=false;
 }
}

// MESSAGE
function showMessage(t){
 const el=document.getElementById('message');
 el.textContent=t;
 el.style.display='block';

 clearTimeout(showMessage.timer);

 showMessage.timer=setTimeout(()=>{
  el.style.display='none';
 },2600);
}

// NPC TALK
function nearestNPC(){
 let best=null;
 let dist=1e9;

 for(const n of npcs){
  const d=player.position.distanceTo(n.group.position);

  if(d<5&&d<dist){
   best=n;
   dist=d;
  }
 }

 return best;
}

function talk(){
 const n=nearestNPC();

 if(n){
  showMessage(n.name+': Namaste! Welcome to our city. Enjoy exploring!');
 }else{
  showMessage('Kisi NPC ke paas jaakar TALK dabayein.');
 }
}

// VEHICLE SYSTEM
function nearestVehicle(){
 let best=null;
 let dist=1e9;

 for(const v of vehicles){
  const d=player.position.distanceTo(v.group.position);

  if(d<6&&d<dist){
   best=v;
   dist=d;
  }
 }

 return best;
}

function toggleVehicle(){

 if(activeVehicle){
  player.visible=true;
  player.position.copy(activeVehicle.group.position);
  player.position.z+=2.8;
  activeVehicle=null;

  showMessage('You are now walking.');
  return;
 }

 const v=nearestVehicle();

 if(v){
  activeVehicle=v;
  player.visible=false;
  showMessage(v.bike?'Bike started!':'Car started!');
 }else{
  showMessage('Car ya bike ke paas jaakar DRIVE dabayein.');
 }
}

// DAY AND NIGHT
function toggleNight(){
 night=!night;

 const target=night?nightSky:daySky;

 scene.background.copy(target);
 scene.fog.color.copy(target);

 hemi.intensity=night?.65:2;
 sun.intensity=night?.15:1.25;

 document.getElementById('weatherTime').textContent=
 night?'NIGHT':'DAY';
}

// CHARACTER MOVEMENT
function moveEntity(obj,dx,dz,speed,dt){
 const len=Math.hypot(dx,dz);

 if(len>.01){
  dx/=len;
  dz/=len;

  obj.position.x+=dx*speed*dt;
  obj.position.z+=dz*speed*dt;

  obj.rotation.y=Math.atan2(dx,dz);
 }
}

// MINI MAP
function updateMap(){
 const c=document.getElementById('map');
 const ctx=c.getContext('2d');

 ctx.clearRect(0,0,180,180);
 ctx.fillStyle='#263d36';
 ctx.fillRect(0,0,180,180);

 ctx.strokeStyle='#87949a';
 ctx.lineWidth=7;

 for(const p of [-72,0,72]){
  ctx.beginPath();
  ctx.moveTo(90+p*.38,0);
  ctx.lineTo(90+p*.38,180);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,90+p*.38);
  ctx.lineTo(180,90+p*.38);
  ctx.stroke();
 }

 ctx.fillStyle='#ffdb45';

 for(const n of npcs){
  ctx.fillRect(
   90+n.group.position.x*.38-2,
   90+n.group.position.z*.38-2,
   4,4
  );
 }

 ctx.fillStyle='#ff4b4b';

 const p=activeVehicle?activeVehicle.group.position:player.position;

 ctx.beginPath();
 ctx.arc(90+p.x*.38,90+p.z*.38,5,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle='#fff';
 ctx.lineWidth=1;
 ctx.strokeRect(1,1,178,178);
}

// MAIN GAME LOOP
let last=performance.now();
let mapTimer=0;

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-last)/1000,.04);
 last=now;

 let forward=
 (keys.KeyW||keys.ArrowUp?1:0)-
 (keys.KeyS||keys.ArrowDown?1:0)-joy.y;

 let side=
 (keys.KeyD||keys.ArrowRight?1:0)-
 (keys.KeyA||keys.ArrowLeft?1:0)+joy.x;

 let speed=(keys.ShiftLeft||keys.ShiftRight||runHeld)?11:6;

 // VEHICLE MOVEMENT
 if(activeVehicle){
  const v=activeVehicle;

 // COINS
 for(let i=0;i<coinObjects.length;i++){
  const c=coinObjects[i];

  if(!c.visible)continue;

  c.rotation.y+=dt*2.2;
  c.position.y=1.8+Math.sin(now*.003+i)*.18;

  const pos=activeVehicle?activeVehicle.group.position:player.position;

  if(pos.distanceTo(c.position)<2.6){
   c.visible=false;
   coins++;

   document.getElementById('coinCount').textContent=coins;

   document.getElementById('missionStatus').textContent=
   coins===5?'Mission complete!':(5-coins)+' coins remaining';

   showMessage(
    coins===5
    ?'MISSION COMPLETE! City Explorer!'
    :'Golden coin collected!'
   );
  }
 }

 // FOLLOW CAMERA
 const follow=activeVehicle?activeVehicle.group:player;

 const target=new THREE.Vector3(
  follow.position.x,
  follow.position.y+2,
  follow.position.z
 );

 const behind=new THREE.Vector3(
  Math.sin(follow.rotation.y)*-9,
  6,
  Math.cos(follow.rotation.y)*-9
 );

 camera.position.lerp(
  target.clone().add(behind),
  1-Math.pow(.001,dt)
 );

 camera.lookAt(target);
