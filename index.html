
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OPEN WORLD INDIA | 3D City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
canvas{display:block}
#gameTitle{position:fixed;top:12px;left:14px;z-index:5;font-size:20px;font-weight:900;text-shadow:2px 2px 5px #000}
#mission,#stats{position:fixed;top:48px;left:14px;z-index:5;background:#000a;padding:10px 13px;border-radius:10px;font-size:13px;line-height:1.6}
#stats{left:auto;right:14px;top:12px}
#message{position:fixed;top:25%;left:50%;transform:translateX(-50%);z-index:10;background:#101827ee;padding:14px 20px;border-radius:12px;display:none;text-align:center;font-weight:bold;max-width:85%;text-align:center}
#prompt{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);z-index:7;background:#111d;padding:10px 15px;border-radius:9px;display:none;font-weight:bold}
#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:5;background:#000a;padding:9px 12px;border-radius:9px;font-size:11px;white-space:nowrap}
#map{position:fixed;right:12px;top:100px;width:125px;height:125px;border:2px solid white;border-radius:10px;background:#17251c;z-index:5}
#mobile{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}
#joystick{position:absolute;bottom:25px;left:20px;width:125px;height:125px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff90;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffffdd;left:36px;top:36px}
#cameraArea{position:absolute;right:0;top:0;width:55%;height:65%;pointer-events:auto;touch-action:none}
.mobileBtn{position:absolute;right:20px;bottom:35px;width:62px;height:62px;border-radius:50%;border:2px solid white;background:#1976d2dd;color:white;font-weight:bold;font-size:12px;pointer-events:auto;touch-action:none}
#runBtn{right:92px;background:#e67e22dd}
#jumpBtn{bottom:108px;background:#27ae60dd}
#actionBtn{bottom:181px;background:#9b59b6dd;display:none}
#talkBtn{bottom:254px;background:#16a085dd;display:none}
@media(pointer:coarse){#mobile{display:block}#help{display:none}#map{width:100px;height:100px}}
</style>
</head>
<body>

<div id="gameTitle">🇮🇳 OPEN WORLD INDIA</div>
<div id="mission">
<b>MISSION: CITY EXPLORER</b><br>
Collect 5 golden coins<br>
<span id="progress">Coins: 0 / 5</span>
</div>
<div id="stats">
<div>🌆 INDIA CITY</div>
<div id="speed">Speed: 0</div>
<div id="vehicleStatus">On Foot</div>
</div>
<canvas id="map" width="200" height="200"></canvas>
<div id="message"></div>
<div id="prompt"></div>
<div id="help">WASD Move | SHIFT Run | SPACE Jump | E Enter/Exit Vehicle | F Talk | Mouse Camera</div>

<div id="mobile">
 <div id="joystick"><div id="stick"></div></div>
 <div id="cameraArea"></div>
 <button class="mobileBtn" id="jumpBtn">JUMP</button>
 <button class="mobileBtn" id="runBtn">RUN</button>
 <button class="mobileBtn" id="actionBtn">DRIVE</button>
 <button class="mobileBtn" id="talkBtn">TALK</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* ================= GAME SETUP ================= */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,90,270);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();

scene.add(new THREE.HemisphereLight(0xffffff,0x526b45,2));
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(60,100,30);
scene.add(sun);

/* ================= MATERIALS ================= */
const material=(color)=>new THREE.MeshLambertMaterial({color});
const mats={
 grass:material(0x5caa50),
 road:material(0x30343a),
 white:material(0xffffff),
 player:material(0x1769aa),
 skin:material(0xc98e68),
 hair:material(0x241b16),
 pants:material(0x202b3b),
 tree:material(0x258a43),
 trunk:material(0x704321),
 glass:new THREE.MeshBasicMaterial({color:0x82c9e9}),
 gold:new THREE.MeshBasicMaterial({color:0xffd700})
};

/* ================= GROUND ================= */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mats.grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
scene.add(ground);

/* ================= ROADS ================= */
function road(x,z,w,l,rot=0){
 const r=new THREE.Mesh(new THREE.PlaneGeometry(w,l),mats.road);
 r.rotation.x=-Math.PI/2;
 r.rotation.z=rot;
 r.position.set(x,.01,z);
 scene.add(r);

 const count=Math.floor(l/12);
 for(let i=0;i<count;i++){
  const mark=new THREE.Mesh(new THREE.BoxGeometry(.22,.04,4),mats.white);
  mark.position.set(x,.045,z-l/2+i*12+6);
  mark.rotation.y=rot;
  scene.add(mark);
 }
}
road(0,0,17,250);
road(0,0,250,17,Math.PI/2);
road(-70,0,10,250);
road(70,0,10,250);
road(0,-70,250,10,Math.PI/2);
road(0,70,250,10,Math.PI/2);

/* Sidewalks */
for(const x of [-10,10,-76,-64,64,76]){
 const p=new THREE.Mesh(new THREE.PlaneGeometry(2,250),material(0xb9b9b9));
 p.rotation.x=-Math.PI/2;p.position.set(x,.025,0);scene.add(p);
}
for(const z of [-10,10,-76,-64,64,76]){
 const p=new THREE.Mesh(new THREE.PlaneGeometry(250,2),material(0xb9b9b9));
 p.rotation.x=-Math.PI/2;p.position.set(0,.025,z);scene.add(p);
}

/* ================= BUILDINGS ================= */
const buildingColors=[0xe8a66b,0xd6d6d6,0xe4c27a,0xb7c7d9,0xd78c73,0xaab7a3,0xc5a6d8,0xd7bd9b];

function createBuilding(x,z,w,h,d){
 const color=buildingColors[Math.floor(Math.random()*buildingColors.length)];
 const group=new THREE.Group();

 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 b.position.y=h/2;group.add(b);

 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.4,.5,d+.4),material(0x555555));
 roof.position.y=h+.25;group.add(roof);

 const floors=Math.floor(h/4);
 for(let f=0;f<floors;f++){
  for(let c=0;c<3;c++){
   const win=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.1,.08),mats.glass);
   win.position.set(-w/3+c*w/3,f*4+2,d/2+.05);
   group.add(win);
  }
 }
 group.position.set(x,0,z);
 scene.add(group);
}
for(let x=-110;x<=110;x+=22){
 for(let z=-110;z<=110;z+=22){
  if(Math.abs(x)<13||Math.abs(z)<13||Math.abs(Math.abs(x)-70)<9||Math.abs(Math.abs(z)-70)<9)continue;
  createBuilding(x,z,10+Math.random()*5,9+Math.random()*22,10+Math.random()*5);
 }
}

/* ================= TREES ================= */
function createTree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,3,6),mats.trunk);
 trunk.position.y=1.5;g.add(trunk);
 const leaves=new THREE.Mesh(new THREE.SphereGeometry(2.2,7,6),mats.tree);
 leaves.position.y=4;g.add(leaves);
 g.position.set(x,0,z);scene.add(g);
}
for(let i=0;i<100;i++){
 const x=(Math.random()-.5)*230,z=(Math.random()-.5)*230;
 if(Math.abs(x)<13||Math.abs(z)<13)continue;
 createTree(x,z);
}

/* ================= PLAYER ================= */
const player=new THREE.Group();
scene.add(player);

const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,4,8),mats.player);
body.position.y=1.3;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.43,12,10),mats.skin);
head.position.y=2.35;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.44,10,7),mats.hair);
hair.scale.set(1,.45,1);hair.position.y=2.62;player.add(hair);

const armGeo=new THREE.CapsuleGeometry(.15,.65,3,6);
const leftArm=new THREE.Mesh(armGeo,mats.skin);
leftArm.position.set(-.67,1.35,0);player.add(leftArm);
const rightArm=new THREE.Mesh(armGeo,mats.skin);
rightArm.position.set(.67,1.35,0);player.add(rightArm);

const legGeo=new THREE.CapsuleGeometry(.19,.65,3,6);
const leftLeg=new THREE.Mesh(legGeo,mats.pants);
leftLeg.position.set(-.25,.43,0);player.add(leftLeg);
const rightLeg=new THREE.Mesh(legGeo,mats.pants);
rightLeg.position.set(.25,.43,0);player.add(rightLeg);
player.position.set(0,0,5);

/* ================= NPC SYSTEM ================= */
const npcs=[];
const npcNames=["Rahul","Amit","Priya","Rohan","Anjali","Vikram","Neha","Arjun"];
const npcColors=[0xe74c3c,0x2980b9,0x27ae60,0xf39c12,0x8e44ad,0x16a085,0xd35400,0x34495e];

function createNPC(index,x,z){
 const g=new THREE.Group();
 const shirt=material(npcColors[index]);
 const skin=material([0xd9a078,0xb87950,0xe0b18a][index%3]);
 const pants=material(0x263448);
 const hair=material(0x241b16);

 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.8,3,7),shirt);
 torso.position.y=1.25;g.add(torso);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.36,10,8),skin);
 h.position.y=2.15;g.add(h);
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.37,10,6),hair);
 cap.scale.set(1,.4,1);cap.position.y=2.4;g.add(cap);

 const armG=new THREE.CapsuleGeometry(.12,.6,3,5);
 const a1=new THREE.Mesh(armG,skin);a1.position.set(-.52,1.3,0);g.add(a1);
 const a2=new THREE.Mesh(armG,skin);a2.position.set(.52,1.3,0);g.add(a2);
 const legG=new THREE.CapsuleGeometry(.16,.62,3,5);
 const l1=new THREE.Mesh(legG,pants);l1.position.set(-.2,.4,0);g.add(l1);
 const l2=new THREE.Mesh(legG,pants);l2.position.set(.2,.4,0);g.add(l2);

 const tag=document.createElement("canvas");
 tag.width=256;tag.height=64;
 const ctx=tag.getContext("2d");
 ctx.fillStyle="#101827";ctx.beginPath();ctx.roundRect(5,5,246,54,12);ctx.fill();
 ctx.fillStyle="white";ctx.font="bold 28px Arial";ctx.textAlign="center";
 ctx.fillText(npcNames[index],128,42);
 const tex=new THREE.CanvasTexture(tag);
 const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
 label.scale.set(3, .75,1);label.position.y=3;g.add(label);

 g.position.set(x,0,z);
 scene.add(g);
 npcs.push({
  group:g,center:new THREE.Vector3(x,0,z),
  target:new THREE.Vector3(x,0,z),
  timer:Math.random()*3,legs:[l1,l2],arms:[a1,a2],
  name:npcNames[index],talking:false
 });
}
const npcSpots=[[-17,18],[18,25],[-35,-18],[35,-20],[-48,45],[50,42],[-20,60],[24,-58]];
npcSpots.forEach((p,i)=>createNPC(i,p[0],p[1]));

function updateNPCs(dt){
 for(const n of npcs){
  n.timer-=dt;
  if(n.timer<=0){
   n.target.set(n.center.x+(Math.random()-.5)*9,0,n.center.z+(Math.random()-.5)*9);
   n.timer=2+Math.random()*4;
  }
  const dx=n.target.x-n.group.position.x;
  const dz=n.target.z-n.group.position.z;
  const dist=Math.hypot(dx,dz);
  if(dist>.2){
   n.group.position.x+=dx/dist*1.3*dt;
   n.group.position.z+=dz/dist*1.3*dt;
   n.group.rotation.y=Math.atan2(dx,dz);
   const w=Math.sin(performance.now()*.006)*.3;
   n.legs[0].rotation.x=w;n.legs[1].rotation.x=-w;
   n.arms[0].rotation.x=-w;n.arms[1].rotation.x=w;
  }
 }
}

let nearbyNPC=null;
const talkLines=[
 "Namaste! Aap kaise hain?",
 "Welcome to India City!",
 "Yahan ka mausam bahut achha hai.",
 "Aap city explore kar rahe hain?",
 "Good morning! Have a nice day.",
 "Mujhe yahan rehna bahut pasand hai."
];

function updateNPCInteraction(){
 nearbyNPC=null;
 let nearest=5;
 for(const n of npcs){
  const d=player.position.distanceTo(n.group.position);
  if(d<nearest){nearest=d;nearbyNPC=n;}
 }
 const prompt=document.getElementById("prompt");
 const talkBtn=document.getElementById("talkBtn");
 if(nearbyNPC){
  prompt.style.display="block";
  prompt.textContent="Press F / TALK to speak with "+nearbyNPC.name;
  talkBtn.style.display="block";
 }else{
  prompt.style.display="none";
  talkBtn.style.display="none";
 }
}
function talk(){
 if(!nearbyNPC)return;
 showMessage(nearbyNPC.name+": "+talkLines[Math.floor(Math.random()*talkLines.length)]);
}
document.addEventListener("keydown",e=>{
 if(e.code==="KeyF")talk();
});

/* ================= VEHICLES ================= */
const vehicles=[];
let activeVehicle=null;

function makeWheel(x,z){
 const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),material(0x171717));
 wheel.rotation.z=Math.PI/2;
 wheel.position.set(x,.4,z);
 return wheel;
}
function createCar(x,z,color=0xd63031){
 const g=new THREE.Group();
 const base=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,4),material(color));
 base.position.y=.85;g.add(base);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.85,2),material(0x9bc9db));
 cabin.position.set(0,1.55,-.15);g.add(cabin);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.7,.12,2.05),material(color));
 roof.position.set(0,2,-.15);g.add(roof);
 for(const x1 of [-1,1])for(const z1 of [-1.3,1.3]){
  g.add(makeWheel(x1,z1));
 }
 const light=material(0xfff2ad);
 for(const x1 of [-.7,.7]){
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.35,.2,.08),light);
  lamp.position.set(x1,1.05,2.02);g.add(lamp);
 }
 g.position.set(x,0,z);
 scene.add(g);
 vehicles.push({group:g,type:"CAR",speed:0,maxSpeed:20});
}
function createBike(x,z,color=0x1976d2){
 const g=new THREE.Group();
 const frame=new THREE.Mesh(new THREE.BoxGeometry(.35,.45,1.3),material(color));
 frame.position.y=.9;g.add(frame);
 const seat=new THREE.Mesh(new THREE.BoxGeometry(.65,.18,.65),material(0x171717));
 seat.position.set(0,1.25,-.1);g.add(seat);
 const handle=new THREE.Mesh(new THREE.BoxGeometry(1,.12,.12),material(0x333333));
 handle.position.set(0,1.35,.65);g.add(handle);
 for(const z1 of [-.75,.8]){
  const wheel=new THREE.Mesh(new THREE.TorusGeometry(.42,.1,8,16),material(0x171717));
  wheel.rotation.y=Math.PI/2;wheel.position.set(0,.45,z1);g.add(wheel);
 }
 g.position.set(x,0,z);
 scene.add(g);
 vehicles.push({group:g,type:"BIKE",speed:0,maxSpeed:27});
}
createCar(5,12,0xe74c3c);
createCar(-20,5,0xf1c40f);
createCar(28,5,0x3498db);
createBike(10,-8,0x16a085);
createBike(-12,-8,0x8e44ad);

function closestVehicle(){
 let found=null,dist=5;
 for(const v of vehicles){
  const d=player.position.distanceTo(v.group.position);
  if(d<dist){dist=d;found=v;}
 }
 return found;
}
function enterExitVehicle(){
 if(activeVehicle){
  player.position.copy(activeVehicle.group.position);
  player.position.x+=2.5;
  activeVehicle.speed=0;
  activeVehicle=null;
  showMessage("You exited the vehicle");
 }else{
  const v=closestVehicle();
  if(!v){showMessage("Vehicle ke paas jaiye!");return;}
  activeVehicle=v;
  showMessage(v.type+" started! Drive safely.");
 }
}
document.addEventListener("keydown",e=>{
 if(e.code==="KeyE"&&!e.repeat)enterExitVehicle();
});

/* ================= COINS ================= */
const coins=[];
const coinPositions=[[15,5,15],[-30,5,25],[40,5,-35],[-55,5,-50],[80,5,60]];
for(const p of coinPositions){
 const c=new THREE.Mesh(new THREE.TorusGeometry(.8,.2,8,16),mats.gold);
 c.position.set(...p);c.rotation.x=Math.PI/2;
 scene.add(c);coins.push(c);
}
let collected=0;
function updateCoins(dt){
 coins.forEach(c=>{
  if(!c.visible)return;
  c.rotation.z+=dt*2;
  if(player.position.distanceTo(c.position)<2.5){
   c.visible=false;collected++;
   document.getElementById("progress").textContent="Coins: "+collected+" / 5";
   showMessage("⭐ Golden coin collected!");
   if(collected===5)showMessage("🏆 MISSION COMPLETE!");
  }
 });
}

/* ================= CAMERA ================= */
let cameraAngle=0,cameraHeight=4.2,cameraDistance=7;
const target=new THREE.Vector3(),offset=new THREE.Vector3(),desired=new THREE.Vector3();
function updateCamera(dt){
 const subject=activeVehicle?activeVehicle.group:player;
 target.set(subject.position.x,subject.position.y+2,subject.position.z);
 const dist=activeVehicle?9:cameraDistance;
 offset.set(Math.sin(cameraAngle)*dist,cameraHeight,Math.cos(cameraAngle)*dist);
 desired.copy(target).add(offset);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(target);
}

/* ================= CONTROLS ================= */
const keys={};
addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
});
addEventListener("keyup",e=>keys[e.code]=false);

let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse"){dragging=true;lastX=e.clientX;lastY=e.clientY;}
});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointermove",e=>{
 if(!dragging||e.pointerType!=="mouse")return;
 cameraAngle-=(e.clientX-lastX)*.005;
 cameraHeight=THREE.MathUtils.clamp(cameraHeight+(e.clientY-lastY)*.025,2.5,9);
 lastX=e.clientX;lastY=e.clientY;
});

/* Mobile joystick */
let joyX=0,joyY=0,joyActive=false;
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
function setJoy(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=38,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 joyX=dx/max;joyY=dy/max;
 stick.style.left=(36+dx)+"px";stick.style.top=(36+dy)+"px";
}
joystick.addEventListener("pointerdown",e=>{joyActive=true;joystick.setPointerCapture(e.pointerId);setJoy(e);});
joystick.addEventListener("pointermove",e=>{if(joyActive)setJoy(e);});
function resetJoy(){joyActive=false;joyX=0;joyY=0;stick.style.left="36px";stick.style.top="36px";}
joystick.addEventListener("pointerup",resetJoy);
joystick.addEventListener("pointercancel",resetJoy);

/* Mobile camera */
let camTouch=false,camX=0,camY=0;
const cameraArea=document.getElementById("cameraArea");
cameraArea.addEventListener("pointerdown",e=>{camTouch=true;camX=e.clientX;camY=e.clientY;cameraArea.setPointerCapture(e.pointerId);});
cameraArea.addEventListener("pointermove",e=>{
 if(!camTouch)return;
 cameraAngle-=(e.clientX-camX)*.008;
 cameraHeight=THREE.MathUtils.clamp(cameraHeight+(e.clientY-camY)*.025,2.5,9);
 camX=e.clientX;camY=e.clientY;
});
cameraArea.addEventListener("pointerup",()=>camTouch=false);
cameraArea.addEventListener("pointercancel",()=>camTouch=false);

/* Mobile buttons */
let mobileRun=false,mobileJump=false;
function holdButton(id,callback){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();callback(true);});
 el.addEventListener("pointerup",()=>callback(false));
 el.addEventListener("pointercancel",()=>callback(false));
 el.addEventListener("pointerleave",()=>callback(false));
}
holdButton("runBtn",v=>mobileRun=v);
holdButton("jumpBtn",v=>mobileJump=v);
document.getElementById("actionBtn").addEventListener("click",enterExitVehicle);
document.getElementById("talkBtn").addEventListener("click",talk);

/* ================= MOVEMENT ================= */
let verticalVelocity=0,isOnGround=true;
const direction=new THREE.Vector3(),forward=new THREE.Vector3(),right=new THREE.Vector3();

function movePlayer(dt){
 const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joyY;
 const s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joyX;
 forward.set(-Math.sin(cameraAngle),0,-Math.cos(cameraAngle));
 right.set(Math.cos(cameraAngle),0,-Math.sin(cameraAngle));
 direction.set(0,0,0).addScaledVector(forward,f).addScaledVector(right,s);
 if(direction.length()>1)direction.normalize();
 const moving=direction.length()>.05;
 const running=keys.ShiftLeft||keys.ShiftRight||mobileRun;

 if(activeVehicle){
  const v=activeVehicle;
  const acceleration=activeVehicle.type==="CAR"?16:20;
  if(f!==0)v.speed+=f*acceleration*dt;
  else v.speed*=Math.pow(.08,dt);
  v.speed=THREE.MathUtils.clamp(v.speed,-v.maxSpeed*.45,v.maxSpeed);
  v.group.rotation.y-=s*dt*(Math.abs(v.speed)/v.maxSpeed)*1.5;
  const front=new THREE.Vector3(-Math.sin(v.group.rotation.y),0,-Math.cos(v.group.rotation.y));
  v.group.position.addScaledVector(front,v.speed*dt);
  v.group.position.x=THREE.MathUtils.clamp(v.group.position.x,-120,120);
  v.group.position.z=THREE.MathUtils.clamp(v.group.position.z,-120,120);
  player.position.copy(v.group.position);
  document.getElementById("speed").textContent="Speed: "+Math.round(Math.abs(v.speed));
  document.getElementById("vehicleStatus").textConten
