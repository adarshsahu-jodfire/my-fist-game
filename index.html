
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPEN WORLD INDIA - Professional NPC Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial;background:#87ceeb;color:white}
canvas{display:block}
#gameTitle{position:fixed;top:15px;left:15px;z-index:5;font-size:21px;font-weight:900;text-shadow:2px 2px 5px #000}
#mission{position:fixed;top:55px;left:15px;z-index:5;background:#0009;padding:10px 14px;border-radius:10px;font-size:14px}
#stats{position:fixed;top:15px;right:15px;z-index:5;background:#0009;padding:10px 14px;border-radius:10px;font-size:14px}
#message{position:fixed;top:25%;left:50%;transform:translateX(-50%);z-index:15;background:#111d;padding:15px 22px;border-radius:12px;display:none;text-align:center;font-weight:bold}
#npcPrompt{position:fixed;bottom:165px;left:50%;transform:translateX(-50%);z-index:12;background:#101827ee;padding:12px 20px;border:1px solid #ffd700;border-radius:12px;display:none;font-weight:bold;white-space:nowrap}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;background:#0009;padding:9px 14px;border-radius:9px;font-size:12px;white-space:nowrap}
#mobileControls{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}
#joystick{position:absolute;bottom:35px;left:25px;width:125px;height:125px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff90;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffffffcc;left:36px;top:36px}
.mobileBtn{position:absolute;right:25px;bottom:45px;width:65px;height:65px;border-radius:50%;border:2px solid white;background:#1976d2cc;color:white;font-size:13px;font-weight:bold;pointer-events:auto;touch-action:none}
#runBtn{right:100px;bottom:45px;background:#e67e22dd}
#jumpBtn{right:25px;bottom:125px;background:#27ae60dd}
#talkBtn{right:100px;bottom:205px;background:#8e44addd;display:none}
#cameraArea{position:absolute;right:0;top:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
@media(pointer:coarse){#mobileControls{display:block}#help{display:none}}
</style>
</head>
<body>

<div id="gameTitle">🇮🇳 OPEN WORLD INDIA</div>
<div id="mission">
<b>MISSION: CITY EXPLORER</b><br>
Collect all 5 golden coins<br>
<span id="progress">Coins: 0 / 5</span>
</div>
<div id="stats">
<div>🌆 INDIA CITY</div>
<div id="speed">Speed: 0</div>
<div>👥 Citizens: 8</div>
</div>
<div id="message"></div>
<div id="npcPrompt"></div>
<div id="help">WASD: Move | SHIFT: Run | SPACE: Jump | Mouse: Camera | E: Talk</div>

<div id="mobileControls">
<div id="joystick"><div id="stick"></div></div>
<div id="cameraArea"></div>
<button class="mobileBtn" id="jumpBtn">JUMP</button>
<button class="mobileBtn" id="runBtn">RUN</button>
<button class="mobileBtn" id="talkBtn">TALK</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* GAME SETUP */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,75,240);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();

/* LIGHTS */
scene.add(new THREE.HemisphereLight(0xffffff,0x536b45,2));
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(50,100,40);
scene.add(sun);

/* MATERIALS */
const mat={
grass:new THREE.MeshLambertMaterial({color:0x55a34a}),
road:new THREE.MeshLambertMaterial({color:0x33383d}),
line:new THREE.MeshBasicMaterial({color:0xffffff}),
player:new THREE.MeshLambertMaterial({color:0x1769aa}),
skin:new THREE.MeshLambertMaterial({color:0xd69b70}),
dark:new THREE.MeshLambertMaterial({color:0x20252b}),
trunk:new THREE.MeshLambertMaterial({color:0x704321}),
leaves:new THREE.MeshLambertMaterial({color:0x238b45})
};

/* GROUND */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat.grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.1;
scene.add(ground);

/* ROADS */
function createRoad(x,z,width,length,rotation=0){
const road=new THREE.Mesh(new THREE.PlaneGeometry(width,length),mat.road);
road.rotation.x=-Math.PI/2;
road.rotation.z=rotation;
road.position.set(x,0.01,z);
scene.add(road);

for(let i=0;i<Math.floor(length/10);i++){
const mark=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.04,4),mat.line);
mark.position.set(x,0.05,z-length/2+i*10+5);
mark.rotation.y=rotation;
scene.add(mark);
}
}
createRoad(0,0,16,250);
createRoad(0,0,250,16,Math.PI/2);
createRoad(-70,0,10,250);
createRoad(70,0,10,250);
createRoad(0,-70,250,10,Math.PI/2);
createRoad(0,70,250,10,Math.PI/2);

/* BUILDINGS */
const buildingColors=[0xe8a66b,0xd6d6d6,0xe4c27a,0xb7c7d9,0xd78c73,0xaab7a3,0xc5a6d8];

function createBuilding(x,z,w,h,d){
const color=buildingColors[Math.floor(Math.random()*buildingColors.length)];
const building=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));
building.position.set(x,h/2,z);
scene.add(building);

const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.5,0.7,d+0.5),new THREE.MeshLambertMaterial({color:0x555555}));
roof.position.set(x,h+0.35,z);
scene.add(roof);

const windowMat=new THREE.MeshBasicMaterial({color:0x78c9e8});
const floors=Math.max(1,Math.floor(h/4));

for(let floor=0;floor<floors;floor++){
for(let col=0;col<3;col++){
const win=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,0.08),windowMat);
win.position.set(x-w/3+col*w/3,floor*4+2,z+d/2+0.05);
scene.add(win);
}
}
}

for(let x=-110;x<=110;x+=22){
for(let z=-110;z<=110;z+=22){
if(Math.abs(x)<13||Math.abs(z)<13||Math.abs(x-70)<9||Math.abs(x+70)<9||Math.abs(z-70)<9||Math.abs(z+70)<9)continue;
createBuilding(x,z,10+Math.random()*5,8+Math.random()*25,10+Math.random()*5);
}
}

/* TREES */
function createTree(x,z){
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.5,3,6),mat.trunk);
trunk.position.set(x,1.5,z);
scene.add(trunk);
const leaves=new THREE.Mesh(new THREE.SphereGeometry(2.2,7,6),mat.leaves);
leaves.position.set(x,4,z);
scene.add(leaves);
}

for(let i=0;i<90;i++){
const x=(Math.random()-0.5)*230;
const z=(Math.random()-0.5)*230;
if(Math.abs(x)<12||Math.abs(z)<12)continue;
createTree(x,z);
}

/* PLAYER */
const player=new THREE.Group();
scene.add(player);

const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.65,1.1,4,8),mat.player);
body.position.y=1.35;
player.add(body);

const head=new THREE.Mesh(new THREE.SphereGeometry(0.48,10,8),mat.skin);
head.position.y=2.55;
player.add(head);

const hair=new THREE.Mesh(new THREE.SphereGeometry(0.49,10,6),mat.dark);
hair.scale.set(1,0.45,1);
hair.position.y=2.83;
player.add(hair);

const armGeometry=new THREE.CapsuleGeometry(0.18,0.75,3,6);
const leftArm=new THREE.Mesh(armGeometry,mat.skin);
leftArm.position.set(-0.78,1.45,0);
player.add(leftArm);

const rightArm=new THREE.Mesh(armGeometry,mat.skin);
rightArm.position.set(0.78,1.45,0);
player.add(rightArm);

const legMat=new THREE.MeshLambertMaterial({color:0x252b35});
const legGeometry=new THREE.CapsuleGeometry(0.22,0.7,3,6);

const leftLeg=new THREE.Mesh(legGeometry,legMat);
leftLeg.position.set(-0.3,0.4,0);
player.add(leftLeg);

const rightLeg=new THREE.Mesh(legGeometry,legMat);
rightLeg.position.set(0.3,0.4,0);
player.add(rightLeg);

player.position.set(0,0,5);

/* PROFESSIONAL NPC SYSTEM */
const npcList=[];
const npcShirtColors=[0xe74c3c,0x2980b9,0x27ae60,0xf39c12,0x8e44ad,0x16a085,0xecf0f1,0x34495e];
const npcSkinColors=[0xd69b70,0xb87950,0xe0aa80,0x9b6348];
const npcHairColors=[0x171717,0x35251d,0x5a3828];
const npcPantsColors=[0x26364a,0x303030,0x514536,0x34495e];

function npcMat(color){
return new THREE.MeshLambertMaterial({color});
}

function npcPart(parent,geometry,material,x,y,z){
const mesh=new THREE.Mesh(geometry,material);
mesh.position.set(x,y,z);
parent.add(mesh);
return mesh;
}

/* NPC NAME TAG */
function createNPCNameTag(name){
const canvas=document.createElement("canvas");
canvas.width=512;
canvas.height=128;
const ctx=canvas.getContext("2d");

ctx.fillStyle="rgba(10,15,25,0.88)";
ctx.beginPath();
ctx.roundRect(8,8,496,112,25);
ctx.fill();

ctx.strokeStyle="#f1c40f";
ctx.lineWidth=5;
ctx.stroke();

ctx.fillStyle="white";
ctx.font="bold 48px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(name,256,64);

const texture=new THREE.CanvasTexture(canvas);
const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true,depthTest:false}));
sprite.scale.set(3.2,0.8,1);
sprite.position.y=3.55;
sprite.visible=false;
return sprite;
}

/* CREATE HUMAN NPC */
function createNPC(name,index,x,z){
const root=new THREE.Group();
scene.add(root);
root.position.set(x,0,z);

const shirt=npcMat(npcShirtColors[index%npcShirtColors.length]);
const skin=npcMat(npcSkinColors[index%npcSkinColors.length]);
const hairMat=npcMat(npcHairColors[index%npcHairColors.length]);
const pants=npcMat(npcPantsColors[index%npcPantsColors.length]);
const shoes=npcMat(0x171717);
const eyes=npcMat(0x171717);

/* BODY */
npcPart(root,new THREE.CapsuleGeometry(0.4,0.75,4,8),shirt,0,1.42,0);

/* NECK AND HEAD */
npcPart(root,new THREE.CylinderGeometry(0.13,0.15,0.2,8),skin,0,2.28,0);
npcPart(root,new THREE.SphereGeometry(0.39,12,10),skin,0,2.62,0);

const hairCap=npcPart(root,new THREE.SphereGeometry(0.4,10,7),hairMat,0,2.83,-0.04);
hairCap.scale.set(1,0.55,1);

/* EARS */
npcPart(root,new THREE.SphereGeometry(0.09,7,6),skin,-0.38,2.62,0);
npcPart(root,new THREE.SphereGeometry(0.09,7,6),skin,0.38,2.62,0);

/* EYES AND NOSE */
npcPart(root,new THREE.SphereGeometry(0.045,6,6),eyes,-0.14,2.66,0.36);
npcPart(root,new THREE.SphereGeometry(0.045,6,6),eyes,0.14,2.66,0.36);
npcPart(root,new THREE.SphereGeometry(0.065,6,6),skin,0,2.55,0.39);

/* SHIRT BUTTONS */
const buttonMat=npcMat(0xffffff);
for(let i=0;i<3;i++){
npcPart(root,new THREE.SphereGeometry(0.035,5,5),buttonMat,0,1.72-i*0.2,0.405);
}

/* BELT */
npcPart(root,new THREE.BoxGeometry(0.65,0.09,0.43),npcMat(0x202020),0,0.96,0);

/* LEFT ARM */
const leftArm=new THREE.Group();
leftArm.position.set(-0.48,1.92,0);
root.add(leftArm);
npcPart(leftArm,new THREE.CapsuleGeometry(0.14,0.55,3,6),shirt,0,-0.34,0);
npcPart(leftArm,new THREE.SphereGeometry(0.15,7,6),skin,0,-0.72,0);

/* RIGHT ARM */
const rightArm=new THREE.Group();
rightArm.position.set(0.48,1.92,0);
root.add(rightArm);
npcPart(rightArm,new THREE.CapsuleGeometry(0.14,0.55,3,6),shirt,0,-0.34,0);
npcPart(rightArm,new THREE.SphereGeometry(0.15,7,6),skin,0,-0.72,0);

/* LEFT LEG */
const leftLeg=new THREE.Group();
leftLeg.position.set(-0.22,0.88,0);
root.add(leftLeg);
npcPart(leftLeg,new THREE.CapsuleGeometry(0.17,0.58,3,6),pants,0,-0.34,0);
npcPart(leftLeg,new THREE.BoxGeometry(0.34,0.17,0.5),shoes,0,-0.72,0.12);

/* RIGHT LEG */
const rightLeg=new THREE.Group();
rightLeg.position.set(0.22,0.88,0);
root.add(rightLeg);
npcPart(rightLeg,new THREE.CapsuleGeometry(0.17,0.58,3,6),pants,0,-0.34,0);
npcPart(rightLeg,new THREE.BoxGeometry(0.34,0.17,0.5),shoes,0,-0.72,0.12);

/* BACKPACK */
if(index%3===0){
npcPart(root,new THREE.BoxGeometry(0.55,0.7,0.22),npcMat(0x6b4226),0,1.55,-0.36);
}

/* NAME TAG */
const nameTag=createNPCNameTag(name);
root.add(nameTag);

npcList.push({
root,name,leftArm,rightArm,leftLeg,rightLeg,nameTag,
centerX:x,centerZ:z,targetX:x,targetZ:z,
radius:5,speed:0.65+Math.random()*0.35,
phase:Math.random()*10,wait:Math.random()*2,talking:false
});
}

/* NPC LOCATIONS */
const npcLocations=[
[-9,-25],[9,-48],[-9,43],[9,78],
[-45,-9],[-75,9],[45,9],[80,-9]
];

const npcNames=["Rahul","Amit","Priya","Ravi","Neha","Arjun","Vikram","Anjali"];

npcLocations.forEach((pos,index)=>{
createNPC(npcNames[index],index,pos[0],pos[1]);
});

/* NPC DESTINATIONS */
function chooseNPCTarget(npc){
npc.targetX=npc.centerX+(Math.random()-0.5)*npc.radius*2;
npc.targetZ=npc.centerZ+(Math.random()-0.5)*npc.radius*2;
npc.wait=1+Math.random()*2;
}

/* NPC WALKING ANIMATION */
function updateNPCs(delta){
const time=performance.now()*0.001;

npcList.forEach(npc=>{
const root=npc.root;

if(npc.talking){
npc.leftArm.rotation.x=-0.2;
npc.rightArm.rotation.x=-0.2;
npc.leftLeg.rotation.x=0;
npc.rightLeg.rotation.x=0;
return;
}

const dx=npc.targetX-root.position.x;
const dz=npc.targetZ-root.position.z;
const distance=Math.hypot(dx,dz);

if(distance<0.35){
npc.wait-=delta;
npc.leftLeg.rotation.x=0;
npc.rightLeg.rotation.x=0;
npc.leftArm.rotation.x=0;
npc.rightArm.rotation.x=0;

root.position.y=Math.sin(time*2+npc.phase)*0.025;

if(npc.wait<=0)chooseNPCTarget(npc);
return;
}

const vx=dx/distance;
const vz=dz/distance;

root.position.x+=vx*npc.speed*delta;
root.position.z+=vz*npc.speed*delta;

const targetRotation=Math.atan2(vx,vz);
let difference=targetRotation-root.rotation.y;

difference=Math.atan2(Math.sin(difference),Math.cos(difference));
root.rotation.y+=difference*Math.min(1,delta*5);

const walk=Math.sin(time*7+npc.phase)*0.45;
npc.leftLeg.rotation.x=walk;
npc.rightLeg.rotation.x=-walk;
npc.leftArm.rotation.x=-walk*0.7;
npc.rightArm.rotation.x=walk*0.7;

root.position.y=Math.abs(Math.sin(time*7+npc.phase))*0.035;
});
}

/* CAMERA */
let cameraAngle=0;
let cameraHeight=4.2;
let cameraDistance=7;

const cameraTarget=new THREE.Vector3();
const cameraOffset=new THREE.Vector3();
const desiredCameraPosition=new THREE.Vector3();

function updateCamera(delta){
cameraTarget.set(player.position.x,player.position.y+2.2,player.position.z);
cameraOffset.set(Math.sin(cameraAngle)*cameraDistance,cameraHeight,Math.cos(cameraAngle)*cameraDistance);
desiredCameraPosition.copy(cameraTarget).add(cameraOffset);

const smooth=1-Math.pow(0.001,delta);
camera.position.lerp(desiredCameraPosition,smooth);
camera.lookAt(cameraTarget);
}

/* KEYBOARD */
const keys={};

window.addEventListener("keydown",e=>{
keys[e.code]=true;
if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
});

window.addEventListener("keyup",e=>keys[e.code]=false);

/* MOUSE CAMERA */
let dragging=false,lastMouseX=0,lastMouseY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
if(e.pointerType==="mouse"){
dragging=true;
lastMouseX=e.clientX;
lastMouseY=e.clientY;
}
});

window.addEventListener("pointerup",()=>dragging=false);

window.addEventListener("pointermove",e=>{
if(!dragging||e.pointerType!=="mouse")return;

const dx=e.clientX-lastMouseX;
const dy=e.clientY-lastMouseY;

cameraAngle-=dx*0.005;
cameraHeight=THREE.MathUtils.clamp(cameraHeight+dy*0.025,2.5,9);

lastMouseX=e.clientX;
lastMouseY=e.clientY;
});

/* MOBILE JOYSTICK */
let joystickX=0,joystickY=0,joystickActive=false;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

function updateJoystick(e){
const rect=joystick.getBoundingClientRect();
let dx=e.clientX-(rect.left+rect.width/2);
let dy=e.clientY-(rect.top+rect.height/2);

const max=38;
const distance=Math.hypot(dx,dy);

if(distance>max){
dx=dx/distance*max;
dy=dy/distance*max;
}

joystickX=dx/max;
joystickY=dy/max;

stick.style.left=(36+dx)+"px";
stick.style.top=(36+dy)+"px";
}

joystick.addEventListener("pointerdown",e=>{
joystickActive=true;
joystick.setPointerCapture(e.pointerId);
updateJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
if(joystickActive)updateJoystick(e);
});

function resetJoystick(){
joystickActive=false;
joystickX=0;
joystickY=0;
stick.style.left="36px";
stick.style.top="36px";
}

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

/* MOBILE CAMERA */
let cameraTouchX=0,cameraTouchY=0,cameraTouchActive=false;
const cameraArea=document.getElementById("cameraArea");

cameraArea.addEventListener("pointerdown",e=>{
cameraTouchActive=true;
cameraTouchX=e.clientX;
cameraTouchY=e.clientY;
cameraArea.setPointerCapture(e.pointerId);
});

cameraArea.addEventListener("pointermove",e=>{
if(!cameraTouchActive)return;

const dx=e.clientX-cameraTouchX;
const dy=e.clientY-cameraTouchY;

cameraAngle-=dx*0.008;
cameraHeight=THREE.MathUtils.clamp(cameraHeight+dy*0.025,2.5,9);

cameraTouchX=e.clientX;
cameraTouchY=e.clientY;
});

cameraArea.addEventListener("pointerup",()=>cameraTouchActive=false);
cameraArea.addEventListener("pointercancel",()=>cameraTouchActive=false);

/* MOBILE BUTTONS */
let mobileRun=false,mobileJump=false;

const runBtn=document.getElementById("runBtn");
const jumpBtn=document.getElementById("jumpBtn");

runBtn.addEventListener("pointerdown",e=>{e.preventDefault();mobileRun=true;});
runBtn.addEventListener("pointerup",()=>mobileRun=false);
runBtn.addEventListener("pointercancel",()=>mobileRun=false);
runBtn.addEventListener("pointerleave",()=>mobileRun=false);

jumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();mobileJump=true;});
jumpBtn.addEventListener("pointerup",()=>mobileJump=false);
jumpBtn.addEventListener("pointercancel",()=>mobileJump=false);
jumpBtn.addEventListener("pointerleave",()=>mobileJump=false);

/* NPC TALK SYSTEM */
const npcPrompt=document.getElementById("npcPrompt");
const talkBtn=document.getElementById("talkBtn");

let nearestNPC=null;
let talkWasDown=false;
let talkCooldown=0;

function showMessage(text){
const message=document.getElementById("message");
message.textContent=text;
message.style.display="block";
clearTimeout(showMessage.timer);
showMessage.timer=setTimeout(()=>message.style.display="none",2500);
}

function talkToNPC(){
if(!nearestNPC||talkCooldown>0)return;

const npc=nearestNPC;
npc.talking=true;
talkCooldown=1;

const dialogues=[
"Namaste! Welcome to India City!",
"Aaj mausam bahut achha hai!",
"This city is beautiful, isn't it?",
"Have a wonderful day!",
"Namaste! Kya haal hai?",
"Enjoy exploring our city!"
];

const dialogue=dialogues[Math.floor(Math.random()*dialogues.length)];
showMessage("🗣️ "+npc.name+": "+dialogue);

setTimeout(()=>{npc.talking=false;},2500);
}

talkBtn.addEventListener("pointerdown",e=>{
e.preventDefault();
talkToNPC();
});

function updateNPCInteraction(delta){
let closest=null;
let closestDistance=4.5;

npcList.forEach(npc=>{
const distance=player.position.distanceTo(npc.root.position);
npc.nameTag.visible=distance<7;

if(distance<closestDistance){
closestDistance=distance;
closest=npc;
}
});

nearestNPC=closest;

if(nearestNPC){
npcPrompt.style.display="block";
npcPrompt.textContent="👤 "+nearestNPC.name+" | Press E to TALK";
talkBtn.style.display="block";
}else{
npcPrompt.style.display="none";
talkBtn.style.display="none";
}

talkCooldown=Math.max(0,talkCooldown-delta);

if(keys["KeyE"]&&!talkWasDown&&talkCooldown<=0){
talkToNPC();
}
talkWasDown=!!keys["KeyE"];
}

/* JUMP */
let verticalVelocity=0;
let isOnGround=true;

/* COINS */
const coins=[];
const coinPositions=[
[15,5,15],[-30,5,25],[40,5,-35],[-55,5,-50],[80,5,60]
];

const coinMaterial=new THREE.MeshBasicMaterial({color:0xffd700});

coinPositions.forEach(pos=>{
const coin=new THREE.Mesh(new THREE.TorusGeometry(0.8,0.2,8,16),coinMaterial);
coin.position.set(...pos);
coin.rotation.x=Math.PI/2;
scene.add(coin);
coins.push(coin);
});

let collected=0;

/* PLAYER MOVEMENT */
const direction=new THREE.Vector3();
const forward=new THREE.Vector3();
