import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------------- BASIC SETUP ---------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,65,205);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff,0x596b43,1.8);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(-35,65,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);

const mat = color => new THREE.MeshLambertMaterial({color});

function box(parent,w,h,d,color,x,y,z,material=null){
 const m = new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material || mat(color)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function cylinder(parent,r1,r2,h,color,x,y,z,seg=10){
 const m = new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,h,seg),
  mat(color)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 parent.add(m);
 return m;
}

/* ---------------- GROUND ---------------- */

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(280,280),
 mat(0x659b50)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.08;
ground.receiveShadow=true;
scene.add(ground);

/* ---------------- ROADS ---------------- */

function road(x,z,w,d){
 box(scene,w,.12,d,0x343a40,x,0,z);

 // Road borders
 if(w>d){
  box(scene,w,.06,.22,0xd8d0b9,x,.08,z-d/2+.2);
  box(scene,w,.06,.22,0xd8d0b9,x,.08,z+d/2-.2);

  for(let a=-w/2+3;a<w/2;a+=7){
   box(scene,2,.018,.13,0xf4e8b2,x+a,.071,z);
  }
 }else{
  box(scene,.22,.06,d,0xd8d0b9,x-d/2+.2,.08,z);
  box(scene,.22,.06,d,0xd8d0b9,x+d/2-.2,.08,z);

  for(let a=-d/2+3;a<d/2;a+=7){
   box(scene,.13,.018,2,0xf4e8b2,x,.071,z+a);
  }
 }
}

road(0,0,13,220);
road(0,-45,150,9);
road(0,45,150,9);
road(-45,0,9,150);
road(45,0,9,150);

// Footpaths

box(scene,220,.22,2,0xb9b4a4,0,.02,8);
box(scene,2,.22,220,0xb9b4a4,-8,.02,0);
box(scene,2,.22,220,0xb9b4a4,8,.02,0);

// Zebra crossings
function crossing(x,z,vertical=false){
 for(let i=-3;i<=3;i++){
  if(vertical){
   box(scene,.7,.025,3,0xf4f0df,x+i*1.05,.085,z);
  }else{
   box(scene,3,.025,.7,0xf4f0df,x,.085,z+i*1.05);
  }
 }
}
crossing(0,-7,true);
crossing(0,7,true);
crossing(-7,0,false);
crossing(7,0,false);

/* ---------------- BUILDINGS ---------------- */

const buildingColliders=[];

function building(x,z,w,d,h,color,name='SHOP'){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);

 box(g,w,h,d,color,0,h/2,0);

 // Roof
 box(g,w*.96,.22,d*.96,0x554b40,0,h+.11,0);

 // Windows
 const windowMat=mat(0x80b4cb);
 for(let yy=1.2;yy<h-.4;yy+=1.55){
  for(let xx=-w/2+.8;xx<w/2-.5;xx+=1.65){
   box(g,.72,.82,.06,0x6c9bb0,xx,yy,d/2+.035,windowMat);
   box(g,.78,.07,.08,0xf4e6ca,xx,yy+.43,d/2+.08);
  }
 }

 // Shop entrance and sign
 box(g,w*.55,.75,.14,0x67452e,0,.4,d/2+.09);
 box(g,w*.85,.55,.18,0xb52e25,0,h*.72,d/2+.13);
 box(g,w*.82,.34,.2,0xffd35a,0,h*.72,d/2+.25);

 // Small rooftop water tank
 if(h>9){
  cylinder(g,.65,.65,1.2,0x477a9c,0,h+1,0,12);
 }
 buildingColliders.push({x,z,w,d});
 return g;
}

/* ---------------- NPC SYSTEM ---------------- */

function makeNPC(x,z,index){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 scene.add(g);

 const colors=[
  0x9b4b31,0x2c7b65,0x6c4a9b,0xc07a24,
  0x3975a8,0x9c3f63,0x55733b,0x555b65
 ];
 const color=colors[index%colors.length];

 box(g,.62,.9,.34,color,0,1.25,0);

 const h=new THREE.Mesh(
  new THREE.SphereGeometry(.25,10,8),skin
 );
 h.position.y=1.9;
 g.add(h);

 const hair2=new THREE.Mesh(
  new THREE.SphereGeometry(.26,10,7,0,Math.PI*2,0,Math.PI/2),
  mat(0x24201d)
 );
 hair2.position.y=1.98;
 g.add(hair2);

 const a=box(g,.18,.68,.2,color,-.4,1.25,0);
 const b=box(g,.18,.68,.2,color,.4,1.25,0);
 const l=box(g,.22,.7,.23,0x30394a,-.16,.38,0);
 const r=box(g,.22,.7,.23,0x30394a,.16,.38,0);

 const names=['Ravi','Meena','Aman','Pooja','Karan','Sita','Arjun','Neha'];

 const tag=document.createElement('div');
 tag.textContent=names[index];
 tag.style.cssText='position:fixed;color:white;background:#071321dd;padding:3px 6px;border-radius:5px;font:11px Arial;pointer-events:none;display:none;z-index:4';
 document.body.appendChild(tag);

 return {
  g,a,b,l,r,tag,
  origin:new THREE.Vector3(x,0,z),
  phase:Math.random()*6,
  idx:index
 };
}

const npcs=[];
[

 [-32,35],[36,38],[-42,-10],[44,-35]
].forEach((p,i)=>npcs.push(makeNPC(p[0],p[1],i)));

const dialogues=[
 'Namaste! Hamare shehar mein aapka swagat hai.',
 'Yahan ka bazaar bahut mashhoor hai.',
 'Aaj mausam bahut achchha hai!',

];

function nearestNPC(){
 let best=null;
 let dist=4.5;
 for(const n of npcs){
  const d=n.g.position.distanceTo(player.position);
  if(d<dist){dist=d;best=n;}
 }
 return best;
}

function talk(){
 if(activeVehicle){
  showMessage('Pehle vehicle se bahar nikliye.');
  return;
 }
 const best=nearestNPC();
 if(best){
  showMessage(best.tag.textContent+': '+dialogues[best.idx]);
 }else{
  showMessage('Kisi NPC ke paas jaakar F / TALK dabayein.');
 }
}

/* ---------------- CARS AND BIKES ---------------- */

function makeVehicle(x,z,type,color,angle=0){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);
 g.rotation.y=angle;

 const isBike=type==='BIKE';

 if(!isBike){
  box(g,2.25,.72,3.6,color,0,.85,0);
  box(g,1.8,.78,1.85,0x8ec0d2,0,1.55,-.25);
  box(g,1.85,.12,1.9,0x26323a,0,1.12,-.25);
  box(g,.22,.25,.12,0xfff0b0,-.72,.9,1.84);
  box(g,.22,.25,.12,0xfff0b0,.72,.9,1.84);
  box(g,.25,.25,.12,0xff3030,-.72,.9,-1.84);
  box(g,.25,.25,.12,0xff3030,.72,.9,-1.84);
 }else{
  box(g,.28,.5,1.55,color,0,.95,0);
  box(g,.65,.16,.6,0x252525,0,1.2,-.15);
  box(g,.16,.65,.16,0x333333,0,.9,.75);
  box(g,.16,.12,.16,0xffdca0,0,1.3,.8);
 }

 const wheels=[];
 const positions=isBike
  ?[[0,.36,-.78],[0,.36,.78]]
  :[[-.95,.48,-1.15],[.95,.48,-1.15],[-.95,.48,1.15],[.95,.48,1.15]];

 for(const p of positions){
  const radius=isBike?.34:.48;
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(radius,radius,.22,12),
   mat(0x17191b)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(p[0],p[1],p[2]);
  g.add(wheel);
  wheels.push(wheel);
 }

 return {g,type,wheels};
}

const vehicles=[
 makeVehicle(-14,5,'CAR',0xd63c32,Math.PI/2),
 makeVehicle(18,9,'CAR',0x2677c8,0),
 makeVehicle(31,-25,'CAR',0xe6b82f,Math.PI),
 makeVehicle(-28,-8,'BIKE',0x35a36d,Math.PI/2),
 makeVehicle(8,-34,'BIKE',0xd64b36,0)
];

let activeVehicle=null;

function nearestVehicle(){
 let best=null;
 let dist=5.5;
 for(const v of vehicles){
  const d=v.g.position.distanceTo(player.position);
  if(d<dist){best=v;dist=d;}
 }
 return best;
}

function toggleVehicle(){
 if(activeVehicle){
  const v=activeVehicle;
  const side=new THREE.Vector3(1,0,0).applyAxisAngle(
   new THREE.Vector3(0,1,0),v.g.rotation.y
  );
  player.position.copy(v.g.position).addScaledVector(side,2.5);
  player.position.y=0;
  activeVehicle=null;

  document.getElementById('mode').textContent='WALK';
  document.getElementById('driveBtn').textContent='DRIVE';
  showMessage('You left the vehicle.');
 }else{
  const v=nearestVehicle();
  if(!v){
   showMessage('Vehicle ke paas jaakar E / DRIVE dabayein.');
   return;
  }

  activeVehicle=v;
  player.position.copy(v.g.position);
  document.getElementById('mode').textContent=v.type;
  document.getElementById('driveBtn').textContent='EXIT';
  showMessage(v.type+' mode! WASD se drive karein.');
 }
}

/* ---------------- CONTROLS ---------------- */

const keys={};
let joy={x:0,y:0};
let running=false;
let jumpRequested=false;
let vertical=0;
let paused=false;

addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 keys[k]=true;

 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)){
  e.preventDefault();
 }

 if(k===' '&&!e.repeat)jumpRequested=true;
 if(k==='e'&&!e.repeat)toggleVehicle();
 if(k==='f'&&!e.repeat)talk();
 if(k==='n'&&!e.repeat)toggleDayNight();
 if(k==='escape'&&!e.repeat)togglePause();
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

function bindHold(id,down,up){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  down();
 });
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  el.addEventListener(ev,e=>{
   e.preventDefault();
   up();
  });
 });
}

bindHold('jumpBtn',()=>jumpRequested=true,()=>{});
bindHold('runBtn',()=>running=true,()=>running=false);

document.getElementById('talkBtn').addEventListener('click',talk);
document.getElementById('driveBtn').addEventListener('click',toggleVehicle);
document.getElementById('nightBtn').addEventListener('click',toggleDayNight);
document.getElementById('pauseBtn').addEventListener('click',togglePause);

/* ---------------- MOBILE JOYSTICK ---------------- */

const joyBase=document.getElementById('joyBase');
const joyStick=document.getElementById('joyStick');
let joyPointer=null;

joyBase.addEventListener('pointerdown',e=>{
 e.preventDefault();
 joyPointer=e.pointerId;
 joyBase.setPointerCapture(joyPointer);
 moveJoy(e);
});

joyBase.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPointer)moveJoy(e);
});

function moveJoy(e){
 const r=joyBase.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const len=Math.hypot(dx,dy);
 const max=39;

 if(len>max){dx=dx/len*max;dy=dy/len*max;}

 joy.x=dx/max;
 joy.y=dy/max;
 joyStick.style.transform=`translate(${dx}px,${dy}px)`;
}

function resetJoy(){
 joyPointer=null;
 joy={x:0,y:0};
 joyStick.style.transform='translate(0,0)';
}

joyBase.addEventListener('pointerup',resetJoy);
joyBase.addEventListener('pointercancel',resetJoy);

/* ---------------- DAY / NIGHT ---------------- */

let dayMode=true;
let lightLevel=1;

function toggleDayNight(){
 dayMode=!dayMode;
 showMessage(dayMode?'Day mode enabled':'Night mode enabled');
}

function updateDayNight(dt){
 const target=dayMode?1:0.06;
 lightLevel=THREE.MathUtils.lerp(lightLevel,target,dt*1.4);

 const sky=new THREE.Color(0x101a36).lerp(
  new THREE.Color(0x87ceeb),lightLevel
 );

 scene.background.copy(sky);
 scene.fog.color.copy(sky);

 sun.intensity=.25+1.35*lightLevel;
 hemi.intensity=.35+1.5*lightLevel;

 streetLights.forEach(l=>{
  l.bulb.intensity=(1-lightLevel)*2.2;
  l.lamp.material.color.setHex(
   lightLevel<.35?0xffd27a:0x777777
  );
 });

 document.getElementById('weatherTime').textContent=
  lightLevel>.5?'DAY':'NIGHT';
}


/* ---------------- CAMERA ---------------- */

let cameraAngle=0;
let cameraPitch=.25;
let dragging=false;
let lastX=0;
let lastY=0;

camera.position.set(0,5,27);
camera.lookAt(player.position);

renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
});

addEventListener('pointerup',()=>dragging=false);

renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

addEventListener('pointermove',e=>{
 if(!dragging)return;

 cameraAngle-=(e.clientX-lastX)*.005;

 cameraPitch=THREE.MathUtils.clamp(
  cameraPitch+(e.clientY-lastY)*.003,
  -.05,.8
 );

 lastX=e.clientX;
 lastY=e.clientY;
});

/* ---------------- MINI MAP ---------------- */

const mapCanvas=document.getElementById('map');
const ctx=mapCanvas.getContext('2d');

function drawMap(){
 ctx.fillStyle='#1b3329';
 ctx.fillRect(0,0,180,180);

 ctx.fillStyle='#64696b';
 ctx.fillRect(0,83,180,14);
 ctx.fillRect(83,0,14,180);
 ctx.fillRect(0,43,180,8);
 ctx.fillRect(0,130,180,8);
 ctx.fillRect(43,0,8,180);
 ctx.fillRect(130,0,8,180);

 for(const v of vehicles){
  ctx.fillStyle='#ff9f43';
  ctx.fillRect(
   90+v.g.position.x*.65-2,
   90+v.g.position.z*.65-2,4,4
  );
 }

 for(const n of npcs){
  ctx.fillStyle='#5be0a0';
  ctx.fillRect(
   90+n.g.position.x*.65-1,
   90+n.g.position.z*.65-1,3,3
  );
 }

 const p=activeVehicle?activeVehicle.g.position:player.position;

 ctx.fillStyle='#ff3f46';
 ctx.beginPath();
 ctx.arc(
  THREE.MathUtils.clamp(90+p.x*.65,2,178),
  THREE.MathUtils.clamp(90+p.z*.65,2,178),
  4,0,Math.PI*2
 );
 ctx.fill();
}

/* ---------------- PAUSE ---------------- */

function togglePause(){
 paused=!paused;
 document.getElementById('pauseBtn').textContent=paused?'▶':'Ⅱ';
 showMessage(paused?'Game Paused':'Game Resumed');
}

/* ---------------- GAME LOOP ---------------- */

const gameClock=new THREE.Clock();
let walkTime=0;
let mapTimer=0;

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(gameClock.getDelta(),.04);

 if(paused){
  renderer.render(scene,camera);
  return;
 }

 walkTime+=dt;
 updateDayNight(dt);

 let forward=
  (keys.w||keys.arrowup?1:0)-
  (keys.s||keys.arrowdown?1:0)-joy.y;

 let side=
  (keys.d||keys.arrowright?1:0)-
  (keys.a||keys.arrowleft?1:0)+joy.x;

 forward=THREE.MathUtils.clamp(forward,-1,1);
 side=THREE.MathUtils.clamp(side,-1,1);

 if(activeVehicle){
  const speed=activeVehicle.type==='CAR'?17:13;

  activeVehicle.g.rotation.y-=side*dt*1.65;

  const dir=new THREE.Vector3(
   Math.sin(activeVehicle.g.rotation.y),
   0,
   Math.cos(activeVehicle.g.rotation.y)
  );

  activeVehicle.g.position.addScaledVector(
   dir,forward*speed*dt
  );

  activeVehicle.g.position.x=THREE.MathUtils.clamp(
   activeVehicle.g.position.x,-108,108
  );

  activeVehicle.g.position.z=THREE.MathUtils.clamp(
   activeVehicle.g.position.z,-108,108
  );

  player.position.copy(activeVehicle.g.position);

  activeVehicle.wheels.forEach(w=>{
   w.rotation.x+=forward*dt*8;
  });

  document.getElementById('speed').textContent=
   Math.round(Math.abs(forward)*speed*3.6);

 }else{
  const speed=(running||keys.shift)?13:7;
  const moving=Math.abs(forward)+Math.abs(side)>.05;

  if(moving){
   const angle=Math.atan2(side,forward)+cameraAngle;

   player.rotation.y=angle;

   movePlayer(
    Math.sin(angle)*speed*dt,
    Math.cos(angle)*speed*dt
   );

   armL.rotation.z=Math.sin(walkTime*10)*.55;
   armR.rotation.z=-Math.sin(walkTime*10)*.55;
   legL.rotation.x=Math.sin(walkTime*10)*.65;
   legR.rotation.x=-Math.sin(walkTime*10)*.65;
  }else{
   armL.rotation.z*=.8;
   armR.rotation.z*=.8;
   legL.rotation.x*=.8;
   legR.rotation.x*=.8;
  }

  if(jumpRequested&&player.position.y<=.01){
   vertical=7;
  }

  jumpRequested=false;
  vertical-=18*dt;

  player.position.y=Math.max(
   0,player.position.y+vertical*dt
  );

  if(player.position.y===0)vertical=0;

  document.getElementById('speed').textContent=
   moving?Math.round(speed*3.6):0;
 }

 player.position.x=THREE.MathUtils.clamp(player.position.x,-108,108);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-108,108);

 /* COINS */

 for(const c of coins){
  if(!c.visible)continue;

  c.rotation.z+=dt*2.5;

  const p=activeVehicle?activeVehicle.g.position:player.position;

  if(c.position.distanceTo(p)<2.1){
   c.visible=false;
   collected++;

   coinCount.textContent=collected;

   missionStatus.textContent=
    collected===5
    ?'Mission completed!'
    :'Coins collected: '+collected+'/5';

   showMessage(
    collected===5
    ?'MISSION COMPLETE! All 5 coins collected!'
    :'Golden coin collected!'
   );
  }
 }

 /* NPC MOVEMENT AND LABELS */

 npcs.forEach(n=>{
  n.phase+=dt*.7;

  n.g.position.x=n.origin.x+Math.cos(n.phase*.55)*2.4;
  n.g.position.z=n.origin.z+Math.sin(n.phase*.55)*2.4;

  n.a.rotation.z=Math.sin(n.phase*5)*.22;
  n.b.rotation.z=-Math.sin(n.phase*5)*.22;
  n.l.rotation.x=Math.sin(n.phase*5)*.25;
  n.r.rotation.x=-Math.sin(n.phase*5)*.25;

  const v=new THREE.Vector3(
   n.g.position.x,
   n.g.position.y+2.5,
   n.g.position.z
  ).project(camera);

  const sx=(v.x*.5+.5)*innerWidth;
  const sy=(-v.y*.5+.5)*innerHeight;

  n.tag.style.left=sx+'px';
  n.tag.style.top=sy+'px';

  n.tag.style.display=
   (v.z<1&&sx>0&&sx<innerWidth&&sy>0&&sy<innerHeight)
   ?'block':'none';
 });

 /* CAMERA FOLLOW */

 const target=activeVehicle
  ?activeVehicle.g.position
  :player.position;

 const distance=activeVehicle?9:7.5;

 const desired=new THREE.Vector3(
  target.x-Math.sin(cameraAngle)*distance,
  target.y+3.8+cameraPitch*3,
  target.z-Math.cos(cameraAngle)*distance
 );

 camera.position.lerp(desired,1-Math.pow(.001,dt));

 camera.lookAt(
  target.x,
  target.y+1.2+cameraPitch,
  target.z
 );

 /* BUTTONS AND PROMPTS */

 const nearNPC=nearestNPC();
 const nearVehicle=nearestVehicle();

 document.getElementById('talkBtn').style.display=
  (!activeVehicle&&nearNPC)?'block':'none';

 document.getElementById('driveBtn').style.display=
  (activeVehicle||nearVehicle)?'block':'none';

 if(activeVehicle){
  prompt.textContent='E / EXIT: Leave vehicle';
  prompt.style.display='block';
 }else if(nearVehicle){
  prompt.textContent='E / DRIVE: Enter vehicle';
  prompt.style.display='block';
 }else if(nearNPC){
  prompt.textContent='F / TALK: '+nearNPC.tag.textContent;
  prompt.style.display='block';
 }else{
  prompt.style.display='none';
 }

 mapTimer+=dt;
 if(mapTimer>.12){
  drawMap();
  mapTimer=0;
 }

 renderer.render(scene,camera);
}

animate();

/* ---------------- RESIZE ---------------- */

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

/* ---------------- WELCOME ---------------- */

setTimeout(()=>{
 showMessage('Welcome to OPEN WORLD INDIA! Collect 5 golden coins.');
},1000);

</script>
</body>
</html>
